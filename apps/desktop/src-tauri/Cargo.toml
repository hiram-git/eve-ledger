[package]
name = "eve-ledger-desktop"
version = "0.1.11"
description = "EVE Ledger: ingresos, gastos e inventario de tus pilotos de EVE Online, en tu equipo"
edition = "2021"
publish = false

[lib]
name = "eve_ledger_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
sys-locale = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
