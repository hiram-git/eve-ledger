# Tests on every PR and on main: the API's (bun test) and the web's end-to-end ones (Playwright with the
# API and a demo database, apps/web/e2e). No network to ESI: the data is made up
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: API · dependencias
        working-directory: apps/api
        run: bun install --frozen-lockfile

      - name: API · pruebas
        working-directory: apps/api
        run: bun test

      - name: Web · dependencias
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Web · navegador de Playwright
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Web · compilar y pruebas de extremo a extremo
        working-directory: apps/web
        run: bun run test:e2e
        env:
          CI: '1'

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
