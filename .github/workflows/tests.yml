# Pruebas en cada PR y en main: las de la API (bun test) y las de extremo a extremo de la web (Playwright con la
# API y una base de demostración, apps/web/e2e). Sin red hacia ESI: los datos son inventados
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: API · dependencias
        working-directory: apps/api
        run: bun install --frozen-lockfile

      - name: API · pruebas
        working-directory: apps/api
        run: bun test

      - name: Web · dependencias
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Web · navegador de Playwright
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Web · compilar y pruebas de extremo a extremo
        working-directory: apps/web
        run: bun run test:e2e
        env:
          CI: '1'

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
