# Instaladores de EVE Ledger de escritorio (apps/desktop) para Windows, macOS y Linux.
# Tauri no compila de forma cruzada: cada instalador se compila en su sistema.
# - Solo: al subir la versión en apps/desktop/src-tauri/tauri.conf.json y llegar a main (merge), se compilan los tres y
#   queda un borrador de release «EVE Ledger x.y.z» con la etiqueta desktop-vx.y.z (si esa release ya existe, no hace nada).
# - A mano: Actions → «Instaladores de escritorio» → Run workflow (los instaladores quedan como artefactos; con la casilla
#   «release» marcada, también el borrador de la versión actual).
# - Con una etiqueta desktop-v* (p. ej. desktop-v0.1.0): igual que al subir la versión (la etiqueta debe coincidir con ella).
# Los instaladores no van firmados: Windows (SmartScreen) y macOS (Gatekeeper) avisan la primera vez (ver INSTALAR.md).
# Actualizaciones automáticas: si el repositorio tiene el secreto TAURI_SIGNING_PRIVATE_KEY (y su contraseña) y la
# variable (o secreto) EVE_LEDGER_UPDATER_PUBKEY, cada versión se firma y la release lleva latest.json; al publicar el borrador,
# las apps instaladas desde estas releases se actualizan solas (ver apps/desktop/README.md).
name: Instaladores de escritorio

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Crear también el borrador de release de la versión de tauri.conf.json'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['apps/desktop/src-tauri/tauri.conf.json']
    tags: ['desktop-v*']

permissions:
  contents: write

# Una compilación a la vez por referencia: dos merges seguidos en main no crean dos borradores de la misma versión
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide si hay que compilar y con qué etiqueta; crea el borrador de la release antes de los tres sistemas
  # (así los tres suben sus instaladores al mismo borrador, sin carreras entre ellos)
  version:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión y release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          WANT_RELEASE: ${{ inputs.release }}
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          tag="desktop-v$version"
          build=true
          case "$EVENT:$REF" in
            push:refs/tags/*)
              if [ "$REF_NAME" != "$tag" ]; then
                echo "::error::La etiqueta $REF_NAME no coincide con la versión $version de tauri.conf.json"
                exit 1
              fi
              ;;
            push:*)
              if gh release view "$tag" --json isDraft --jq '.isDraft' >/tmp/draft 2>/dev/null; then
                echo "::notice::Ya existe la release $tag ($( [ "$(cat /tmp/draft)" = true ] && echo borrador || echo publicada )): no se compila. Sube la versión en tauri.conf.json para una nueva."
                build=false
              fi
              ;;
            *)
              [ "$WANT_RELEASE" = true ] || tag=""
              ;;
          esac
          if [ "$build" = true ] && [ -n "$tag" ] && ! gh release view "$tag" >/dev/null 2>&1; then
            # Las notas: la sección de esta versión en CHANGELOG.md (de «## x.y.z» a la siguiente «## »)
            awk -v v="$version" 'index($0, "## " v " ") == 1 || $0 == "## " v { f = 1; next } f && /^## / { exit } f' CHANGELOG.md >/tmp/notes.md
            [ -s /tmp/notes.md ] || echo "Desktop installers for EVE Ledger $version." >/tmp/notes.md
            printf '\nInstall guide: %s/%s/blob/main/apps/desktop/INSTALAR.md · Changelog: %s/%s/blob/main/CHANGELOG.md\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >>/tmp/notes.md
            # Sin firma de código: cómo comprobar que un instalador salió de este repositorio
            printf '\n**Verify a download.** The installers are built by GitHub Actions from this repository and are not code-signed. Compare the file with `SHA256SUMS-<system>.txt` below, or, with the GitHub CLI: `gh attestation verify <file> --repo %s`\n' \
              "$GITHUB_REPOSITORY" >>/tmp/notes.md
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "EVE Ledger $version" --notes-file /tmp/notes.md
            echo "::notice::Borrador de la release $tag creado: publícalo cuando estén los tres instaladores"
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest # Apple Silicon (arm64)
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    # Atestación de origen de los instaladores (proyecto abierto, sin firma de código: así se puede comprobar que un
    # instalador salió de este repositorio y de este workflow)
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # La clave pública no es secreta (va dentro de la app), pero se acepta también como secreto del repositorio
      UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && (vars.EVE_LEDGER_UPDATER_PUBKEY != '' || secrets.EVE_LEDGER_UPDATER_PUBKEY != '') }}
    steps:
      # La app de EVE va incluida (el asistente ya no deja crear una propia): sin su Client ID, el instalador no
      # podría vincular pilotos. Se crea en developers.eveonline.com (ver apps/desktop/README.md)
      # Las actualizaciones automáticas necesitan las dos claves: con solo una, la release saldría sin latest.json y las
      # apps instaladas desde ella no buscarían nunca versiones nuevas, así que a medias es un error (sin ninguna, un aviso)
      - name: Client ID de la app de EVE incluida y claves del actualizador
        env:
          CLIENT_ID: ${{ vars.EVE_LEDGER_CLIENT_ID }}
          HAS_PRIVATE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_PUBLIC: ${{ vars.EVE_LEDGER_UPDATER_PUBKEY != '' || secrets.EVE_LEDGER_UPDATER_PUBKEY != '' }}
        shell: bash
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Falta la variable del repositorio EVE_LEDGER_CLIENT_ID (Settings → Secrets and variables → Actions → Variables). Sin ella el instalador no puede vincular pilotos."
            exit 1
          fi
          if [ "$HAS_PRIVATE" = true ] && [ "$HAS_PUBLIC" != true ]; then
            echo "::error::Falta EVE_LEDGER_UPDATER_PUBKEY (el contenido de eve-ledger.key.pub) como variable o secreto del repositorio: sin ella, estos instaladores no se actualizarían solos."
            exit 1
          elif [ "$HAS_PRIVATE" != true ] && [ "$HAS_PUBLIC" = true ]; then
            echo "::error::Falta el secreto del repositorio TAURI_SIGNING_PRIVATE_KEY (el contenido de eve-ledger.key): sin él, estos instaladores no se actualizarían solos."
            exit 1
          elif [ "$HAS_PRIVATE" != true ]; then
            echo "::notice::Sin claves del actualizador: estos instaladores no buscarán versiones nuevas (ver apps/desktop/README.md)."
          fi

      - uses: actions/checkout@v4

      - name: Dependencias de Tauri (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: API y web empaquetadas + Bun como proceso auxiliar
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run prepare:server

      - name: Configuración del actualizador (clave pública y artefactos firmados)
        if: env.UPDATER == 'true'
        working-directory: apps/desktop
        env:
          PUBKEY: ${{ vars.EVE_LEDGER_UPDATER_PUBKEY || secrets.EVE_LEDGER_UPDATER_PUBKEY }}
        run: >
          bun -e "await Bun.write('src-tauri/tauri.updater.conf.json', JSON.stringify({
          bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.PUBKEY.trim(),
          endpoints: ['https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/latest/download/latest.json'] } } }))"

      - name: Compilar los instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: Client ID de una app de EVE para toda la corp (variable del repositorio; ver apps/desktop/README.md)
          EVE_LEDGER_CLIENT_ID: ${{ vars.EVE_LEDGER_CLIENT_ID }}
          # El repositorio que compila: va al User-Agent de ESI y al aviso legal de la app
          EVE_LEDGER_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: ${{ env.UPDATER == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: 'EVE Ledger __VERSION__'
          releaseBody: 'Instaladores de EVE Ledger de escritorio. Guía de instalación: apps/desktop/INSTALAR.md'
          # Borrador (ya creado en «version»): las apps instaladas se actualizan cuando lo publicas
          releaseDraft: true

      # Sin firma de código (decisión del usuario: proyecto abierto), dos formas de comprobar un instalador: la
      # atestación de origen de GitHub (gratis en repositorios públicos; en uno privado no está disponible) y las
      # sumas SHA-256, que se suben a la release junto a los instaladores
      - name: Atestación de origen
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage

      - name: Sumas SHA-256
        working-directory: apps/desktop/src-tauri/target/release/bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          bun -e "
            const { createHash } = await import('node:crypto');
            const { basename } = await import('node:path');
            const lines = [];
            for (const ext of ['exe', 'msi', 'dmg', 'deb', 'AppImage'])
              for await (const f of new Bun.Glob('**/*.' + ext).scan('.')) {
                const hash = createHash('sha256').update(new Uint8Array(await Bun.file(f).arrayBuffer())).digest('hex');
                lines.push(hash + '  ' + basename(f));
              }
            await Bun.write('SHA256SUMS-${{ matrix.name }}.txt', lines.join('\n') + '\n');
            console.log(lines.join('\n'));
          "
          if [ -n "$TAG" ]; then gh release upload "$TAG" "SHA256SUMS-${{ matrix.name }}.txt" --clobber; fi

      - name: Guardar los instaladores
        uses: actions/upload-artifact@v4
        with:
          name: eve-ledger-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS-*.txt
          if-no-files-found: warn
