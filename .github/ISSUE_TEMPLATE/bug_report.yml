name: Bug report
description: Something doesn't work, crashes or won't install.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! You can write in English, Spanish or German.

        **Never attach or paste** your `ledger.db`, your `ledger.env`, your `ENC_KEY`, or anything that looks like a token. EVE Ledger never needs them to look into a bug.
  - type: input
    id: version
    attributes:
      label: EVE Ledger version
      description: It's at the bottom of the dashboard, for example `v0.1.17`.
      placeholder: v0.1.17
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows
        - macOS (Apple Silicon)
        - Linux (.deb)
        - Linux (AppImage)
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Installing or starting the app
        - Linking a pilot (EVE login)
        - Sync
        - Summary
        - Indicators
        - Balances
        - Doctrines
        - Pilots or backups
        - Updates
        - System tray
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead. Screenshots help; blur anything you don't want public.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Pilots
        2. Click "Link pilot"
        3. …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        In the app menu, **EVE Ledger → Open logs**, then copy the relevant lines of `api.log` (and `web.log` if the page fails). Logs include your pilots' names and IDs; edit them out if you prefer.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I didn't include my database, my `ledger.env`, my encryption key or any token.
          required: true
